<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קטלוג מצומצם — סלאוויטא</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1e3a8a;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1e3a8a;
      border-bottom: 2px solid rgba(255,255,255,.15);
      flex-shrink: 0;
      gap: 12px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: white;
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: .9rem;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,.28); }

    .hint {
      font-size: .78rem;
      opacity: .6;
      white-space: nowrap;
    }

    .pdf-wrap {
      flex: 1;
      background: #374151;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 1rem;
      opacity: .8;
      pointer-events: none;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="title">📖 קטלוג מצומצם — סלאוויטא</div>
  <div class="controls">
    <span class="hint">ניווט: גלגלת עכבר · חצים · +/− לזום</span>
    <a class="btn"
       href="https://drive.google.com/uc?export=download&id=1VN2ZjJvbFNgOAJaaAp9IuqzH8iZUKhY3"
       target="_blank">
      ⬇ הורד PDF
    </a>
  </div>
</header>

<div class="pdf-wrap">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>טוען קטלוג…</div>
  </div>
  <iframe
    id="frame"
    src="https://drive.google.com/file/d/1VN2ZjJvbFNgOAJaaAp9IuqzH8iZUKhY3/preview"
    allow="autoplay"
    onload="document.getElementById('loading').style.display='none'"
  ></iframe>
</div>

</body>
</html>
