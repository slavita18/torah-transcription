<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קטלוג מצומצם — סלאוויטא</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Arial Hebrew', 'David', Arial, sans-serif;
      background: #faf8f2;
      color: #1f2937;
      min-height: 100vh;
      direction: rtl;
    }

    /* ─── Header ─── */
    header {
      background: #1e3a8a;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-badge {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      padding: 4px 16px;
      font-size: .85rem;
      white-space: nowrap;
    }

    /* ─── Main layout ─── */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 12px 16px;
      min-height: calc(100vh - 60px);
    }

    .viewer {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 780px;
    }

    /* ─── Navigation buttons ─── */
    .nav-btn {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid #bfdbfe;
      background: white;
      color: #1e3a8a;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      user-select: none;
    }
    .nav-btn:hover:not(:disabled) {
      background: #eff6ff;
      border-color: #1e3a8a;
      box-shadow: 0 2px 8px rgba(30,58,138,.2);
      transform: scale(1.06);
    }
    .nav-btn:active:not(:disabled) { transform: scale(.94); }
    .nav-btn:disabled {
      border-color: #e5e7eb;
      color: #d1d5db;
      cursor: not-allowed;
      box-shadow: none;
      background: #f9fafb;
    }

    /* ─── Page card ─── */
    .page-card {
      flex: 1;
      min-width: 0;
      background: white;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,.09);
      border: 1px solid #fde68a;
      overflow: hidden;
      transition: opacity .22s, transform .22s;
    }
    .page-card.fade { opacity: 0; transform: scale(.97); }

    .page-strip {
      background: #1e3a8a;
      color: white;
      text-align: center;
      padding: 10px;
      font-size: .9rem;
      letter-spacing: .06em;
      font-weight: 600;
    }

    .page-body {
      padding: 32px 40px;
      min-height: 55vh;
      direction: rtl;
      text-align: right;
      line-height: 1.95;
      font-size: 1.02rem;
      color: #1f2937;
    }
    @media (max-width: 600px) {
      .page-body { padding: 20px 18px; font-size: .95rem; }
    }

    .page-body p { margin-bottom: .8rem; }
    .page-body strong { color: #1e3a8a; font-weight: 700; }

    /* ─── Cover page special ─── */
    .cover .page-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(160deg, #f0f7ff 0%, #fffbeb 100%);
      gap: 6px;
      font-size: 1rem;
    }
    .cover .logo-text {
      font-size: 2.4rem;
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: .08em;
      font-family: Georgia, serif;
      line-height: 1;
    }
    .cover .catalog-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #92400e;
      letter-spacing: .12em;
      margin: 8px 0 4px;
    }
    .cover .contact {
      color: #374151;
      font-size: .95rem;
      margin-top: 12px;
      line-height: 2;
    }
    .cover .dsb {
      font-size: 1.2rem;
      color: #1e3a8a;
      margin-top: 14px;
    }

    /* ─── Dots ─── */
    .dots {
      display: flex;
      gap: 6px;
      margin-top: 22px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 320px;
    }
    .dot {
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all .15s;
      background: #d1d5db;
      height: 10px;
      width: 10px;
      padding: 0;
    }
    .dot:hover { background: #93c5fd; }
    .dot.active { width: 22px; background: #1e3a8a; }

    /* ─── Hint ─── */
    .hint {
      margin-top: 14px;
      font-size: .78rem;
      color: #9ca3af;
    }
  </style>
</head>

</main>

אגב וליאו ףרש י\"ע אלו ךאלמ י\"ע אלשו\n\nהמ ןיבהל ךירצו .ךאלמ תחילש ןושל רמאנ\n\n.הזב םתנווכ\n\n'ה תדובעל תעייסמ הסנרפה\n\nןייעו\n\nתמא תפשב\n\nהעורה שרדמב ה\"ד ז\"מרת יחיו)\n\n(יתוא\n\nב\n\nהסנרפד אוה קוליחהד ראיבד\n\nי\"עד ,תוימשגב ןהו תוינחורב ןה םדאל תעייסמ\n\nתא דובעל ול לקנ הסנרפהמ תוגאד ול ןיאש\n\nךכ י\"עו ,הלואגה ןמ הלודג איה ןכלו ת\"ישה\n\nתושגרתמה תודרטה לכמ הלואגל הכוז אוה\n\nתנווכ וזו ,ומויב םוי ידימ םדאה לע תואבו\n\nתובהלתההו תוררועתהה ונייה הסנרפהד ל\"זח\n\nאיה אליעלד אתורעתאב האבה 'ה תדובעל\n\nןישיב ןיקתע לכמ\n\nהלואגל םדאה תא תעייסמה\n\n.וילע םיאבה\n\nיפלו\n\nירבד רואיב והזד רמול הארנ ל\"נה\n\nלע ללפתהל ךירצש ל\"נה ף\"ירה\n\nי\"ע קרש ןויכ הלואגה םדוק הסנרפה\n\nהלואגל תוכזל לוכי ליעל ראובמכו הסנרפה\n\n.הירחא האבה\n\nהטיחש םיכירצ אל םיגדש םעט\n\nדוע\n\nברקב בורל וגדיו' ביתכד ראבנו םידקנ\n\nירהד קוספה ןושלב קיידל שיו ,'ץראה\n\nברקב' ןושל טקנ עודמ כ\"או םימב םייח םיגד\n\nל\"צז רפוס ןועמש יבר צ\"הגה ראיבו ,'ץראה\n\n'מגה ירבד פ\"ע\n\n(:זכ ןילוח)\n\n,האלילג רבוע שרד ,\n\n,םינמיס ינשב הרשכה השביה ןמ תארבנש המהב\n\n,םולכ אלוב ןרישכה םימה ןמ וארבנש םיגד\n\n,דחא ןמיסב ורשכה קקרה ןמ ארבנש ףוע\n\nםתוא ונייה תומהבד הזב הנווכהו .כ\"ע\n\nאלא ןרישכהל ןיאו ירמגל השודקהמ םיקתונמה\n\nםדאל הנווכה תופועו ,הרומג הטיחש י\"ע\n\nםיזמרמ םיגדו ,טעומ ןוקית ךירצה ינוניב\n\nעיפשהל םהילע ללפתהל תולגב םהשךרדב םיכלוה םהש\n\nםדורמו םיינעמ םליצהל בוט לכ םהל\n\n.ש\"ייע ,'וכו\n\n.ב\n\nהלואג שיקה יתוא לאוגה 'וכ יתוא העורה שרדמב ,םש ל\"ז\n\nיכ דבלב ףוגב וניא הסנרפ .'וכ םוי לכב הסנרפ המ הסנרפל\n\nש\"מכ הסנרפ ללכב אוה םוי לכב תושפנה תושדחתה םג\n\nםוי לכב כ\"ג הלואגו .תישארב השעמ םוי לכב ובוטב שדחמה\n\nהזיא ןמז לכב שיש תולגה טרפב הלואגה תראה םוי לכב שיש\n\nלומו םוי לכב וילע רבגתמ ורצי ש\"מכ 'ה דבוע לכל רתסה\n\nןושל הלפתב לארשי לאוג ש\"מכ םוי לכב כ\"ג הלואג שי הז\n\nהלואגה תראה אצמנ מ\"מ המילש הלואג וניא יכ םא .הוה\n\nהשנמל םירפא םידקהש ומכ הלואגל הסנרפ םידקהו .םוי לכב\n\n.הלואג 'יחב אוה ילמע לכ םיקלא ינשנ יכ השנמ םש יכ\n\nיכ ל\"ז ז\"ומ יפמ יתעמשו .הסנרפ איה ינרפה ש\"ע םירפאו\n\nתויהל וכרד 'יה ףסויו בוט השעו ערמ רוס םה ולא םינינע 'ב\n\nתחיתפ ת\"ישה ןתיש ןקית ה\"ע וניבא בקעיו .ערמ רוס םדוקמ\n\nלכונ הראהה ז\"יעו יוארכ םינקותמ ןיאש םגה הרותל בלה\n\nהלואגל הסנרפה תמדקה ןינע הזו .'וכ ערמ רוס תויהל כ\"חא\n\n.כ\"ע ,ש\"מכ\n\nתורבד\n\nלארשי ינב יכרצ לכ רובע קידצה תליפת\n\nשדק\n\nד\n\nוניאו\n\nאוה םירבדה רדס הרואכל אלהד ןבומ\n\nהכירצ הניא הרישה תדובעד ,ךפיהל\n\nתונברקה תדובע אלא ,תונברקה תדובע תא\n\n.ב\"צו ,הרישה תדובעל הכירצ\n\nהרותה תוקיתמו תובירע\n\nשי\n\nםשב רמאנו אנבודמ דיגמהמ עודי לשמ\n\nהתימאל ןווכמ אוהש ע\"יז קצאקמ ק\"הרה\n\nאיבהל ותוא הויצ וברש דבעל לשמ ,הרות לש\n\nוינודא תיבל בורק דבעה עיגהשכו ,ותיבל הליבח\n\nרתויב הדיבכ הליבחהש קעוצ דבעהש ובר עמש\n\nוניאו\n\nרמא ובר תאז עמששכו ,האשונל לוכי\n\n,רתויב הדיבכ הליבחהש קעוצ התא םא ,דבעל\n\n.ילש הניא תאזה הליבחהו העוט התאש עודיב\n\nלשמנהו\n\nרמואו קעוצ לארשימ םדא םאד ,אוה\n\nוניאו ול השק תווצמהו הרותה םויקש\n\nתרות הניא וזו ,העוט אוהש עודיב ,םלבוסל לוכי\n\nהבוט איה ה\"בקה ונל ןתנש הרותהש ןויכ ,השמ\n\nהנוכנה ךרדב ךלוה וניאו ,הבר תוקיתמב המיענו\n\n.הרותה תובירעו תוקיתמ תא ןיבי הבש\n\nהנוש ףוריצה ךא דחא אוה רפסמה\n\nאמגודלו\n\nםעפ רלוד 1000 הנומ םדאשכ\n\nםתוא הנומ אוה כ\"חאו ,תחא\n\nותוא ראשי דימת ללוכה םוכסה ,הינש םעפ\n\nרטשהש הנוש אוה תורטשה ףוריצ ךא ,רפסמה\n\nלוכי ,הנושארה הריפסב 78 רפסמ היהש\n\nןויכ ,'וכו הינשה םעפב 364 'סמ תויהל\n\nכ\"ג ןידה אוהו .הנתשמ םעפ לכב ףוריצהש\n\nיניס רהב הלביקש יפכ השמ תרות ,תוינחורב\n\nהרות אהת אלו תפלחומ אהת אלו ,תחא איה\n\nןיידעש הנשו הנש לכבש ףוריצה ךא ,תרחא\n\nתונויסנ ונייהד ,הנתשמ ףוריצה ,וניתולגב ונא\n\nםימש תאריב רודה בצמ ,הסנרפה בצמ ,רודה\n\nהרותה לבא ,הנשו הנש לכב הנתשמ לכה ,'וכו\n\n.יניסמ ןתניתנכ םיראשנ םה תווצמו\n\nפ\"עו\n\nללכ תמאבד ,וניתוישוק ץרתל הארנ הז\n\nןויכ 'רפסי אלו דמי אל' םה לארשי\n\nלארשי ללכו רפסיהל לוכי וניאש םיה לוחכ םהש\n\nלארשי ללכ לש תואיצמה ירהש ,רפסמ םהל ןיא\n\n.ל\"נכו רודה בצמ יפל עגרו עגר לכב הנתשמ\n\n'לארשי ינב רפסמ היהו' קוספה שוריפ והזו\n\nונל שי ןכאד לארשי ללכ לש רפסמה ונייה\n\nללכ תא רופסל םילוכי ונא ןיא ךא רפסמ\n\nאלו דמי אל רשא םיה לוחכ ונאש ןויכ לארשי\n\nהנתשמ ותואיצמו לארשי ללכ לש ףוריצהד ,רפסי\n\n.ל\"נכו רודה יפל תעו תע לכב\n\nרודה בצמ יפל הרישה תדובע\n\nפ\"עו\n\nתריש ןינעמ 'מגה רמאמ םג ראובי הז\n\nעודיד ,ןברקה תברקה תעשב םיולה\n\nהנתשמ םה ןוגינ לכבו ,ן\"טאנ העבש שי הניגנבד\n\nאתיאד המ והזו .ריש והזו ןפוריצ יפכ ןרדס\n\n,הריש וז הדובע הכירצש הדובע והזיא ,'מגב\n\nלכב ,אוהש ףוריצ לכש ונייהד ,הרישה תדובע\n\nםדאש םיבצמה לכבו ,םישדחה תונויסנה לכבו ,םוי\n\nאיהש הריתי הדובע הכירצ וז הדובע ,םהב אצמנ\n\nךיאה אצמי אוהש בצמ לכבש תונברקה תדובע ומכ\n\nונוצרו ויתווצמו ותרות םייקלו ,ת\"ישה דובעל\n\n.םדאה וב היהיש ףוריצו בצמ הזיאב ךרבתי\n\nתורבד\n\nלארשי ינב יכרצ לכ רובע קידצה תליפת\n\nשדק\n\nא\n\nג\"פשת יחיו\n\nלאר˘י ינב יכרˆ לכ רובע ˜ידˆה ˙ליפ˙\n\nהברוחב יסוי יבר תליפת\n\nאתיא\n\n'מגב\n\n(.ג תוכרב)\n\nםעפ יסוי יבר רמא אינת ,\n\nהברוחל יתסנכנו ךרדב ךלהמ יתייה תחא\n\nל\"ז והילא אב ,ללפתהל םילשורי תוברוחמ תחא\n\nרחאל ,יתלפת יתמייסש דע חתפה לע יל רמשו\n\nיתרמאו ,יבר ךילע םולש יל רמא יתלפת יתמייסש\n\nהמ ינפמ ינב יל רמאו ,ירומו יבר ךילע םולש ול\n\nיל רמאו ,ללפתהל ול יתרמא ,וז הברוחל תסנכנ\n\nיתייה ארייתמ ול יתרמאו ,ךרדב ללפתהל ךל היה\n\nךל היה יל רמאו ,םיכרד ירבוע יב וקיספי אמש\n\n.ש\"ייע ,'וכו הרצק הלפת ללפתהל\n\nלארשי ינב יכרצ הליפתה רקיע\n\nןייעו\n\nבקעי ןיע לע ף\"ירב\n\n(םש)\n\nשיד ראיבד\n\nרעצ לע הליפת .א ,תוליפת ינימ 'ב\n\nהליפת .ב .ארפעמ אתניכש ימקואלו הניכשה\n\nםיקוקז םדא ינב רשא םיימשג םיכרצ לע\n\nהמ הזד ראבמו .המילשה הלואגל ךרדב םהל\n\nתחא הברוחל יתסנכנ' יסוי יבר רמאש\n\nללפתהש ונייהד ,'ללפתהל םילשורי תוברוחמ\n\nוחיכוהש המ הזו ,הניכשה תולג קר לע\n\nלארשי ללכ לע ללפתהל ול היהש ל\"ז והילא\n\nתולגב םהש 'ךרדב' םיכלוה םהש דועב\n\nםליצהל בוט לכ םהל עיפשהל םהילע ללפתהל\n\nךל היה' ול רמאש והזו ,םדורמו םיינעמ\n\nןזיב' םגתפה עודיש ומכו .'ךרדב ללפתהל\n\nקרו ,'קנירטא ךיוא ןעמ ףראד עמשטערק\n\n'ךרדב' לארשי ךמע יכרצ לע ללפתמש ימ\n\nרעצ לע ףא ללפתהל לוכי אוה הלואגל\n\nהמלש תראפתב ןייעו ,הניכשה\n\nא\n\n(בשיו)\n\nראיבש\n\n.הכוראב ז\"כ\n\n.א\n\n,ל\"ז\n\nםכשב םיעור ךיחא אלה ףסוי לא לארשי רמאיו\n\n.'וגו ךיחא םולש תא האר אנ ךל 'וגו\n\nםיבותכה ךישמהל שי\n\nארמגה י\"פע .זמר ךרדב ל\"נה\n\n(.ג תוכרב)\n\nםעפ יסוי 'ר רמא\n\nאב ללפתהל םילשורי תוברוחמ תחא הברוחל יתסנכנו 'וכ תחא\n\nתסנכנ המ ינפמ ינב יל רמאו 'וכ חתפה לע יל רמשו 'וכ והילא\n\n.ךרדב ללפתהל ךל היה יל רמאו ללפתהל ול יתרמא וז הברוחל\n\nתובא יקרפב רמאמה לע 'יפ םירפסב וניצמש המ י\"פע ראובי\n\n(א\"מ ב\"פ)\n\nםדאהש רעצה לדוג יפל 'יפ .ךממ הלעמל המ עד\n\nילפכב הלעמל עגונש המ ןנובתהל שי רעצבו קחודב ול שי\n\nהרצב יכנא ומע לוכיבכ הניכשה תולג רעצב םילפכ\n\n,אצ םילהת)\n\n(וט\n\nרעצה עדת ךלש רעצה ןמ ךממ הלעמל המ עד הזו ,\n\n.לוכיבכ הלעמלש\n\nולכתסה אל רשא םיקידצ המכ ויה ןכל\n\nהניכשה רעצ תוללכ לע קר י\"נב לש רעצו קחוד לע ללכ\n\nה\"ב ארובה תולדג לע םילחימו םיפצמ םה תאז קר םהימי לכו\n\nה\"ע איבנה והילאב ש\"מכ תואבצ 'ה תאנקב\n\n(י טי א-םיכלמ)\n\nאנק\n\nודימלת היהש יתימא ןב הנוי וירחאלש רודב ןכא .'וגו יתאנק\n\nהיהי אלש הונינ לא האובנה תוחילשב תכלל הצר אל והילא לש\n\n.עודיכ י\"נב לע גורטק ו\"ח\n\nןוכשי ךרדה וז אל תמאב יכ\n\nתבוט לע כ\"ג לכתסי רשאכ קר קידצה תחלצה רוא\n\n.םתרצב רעטצהלו םידסחו םימחר םהילע ררועל י\"נב\n\nתחא םעפ יסוי ר\"א 'מגה 'יפב בתוכהב בקעי ןיעב ןייע ןייעו\n\nהיה ותבשחמ 'יפ .םילשורי תוברוחמ תחא הברוחל יתסנכנ\n\nוהילא אבו .םילשורי תוברוח הזו הניכשה תולג רעצב רעטצהל\n\n'יפ .ךרדב ללפתהל ךל היה ול רמא ,חתפה לע רמשו\n\nדועב\n\n• 26 •", "הדוהי ינב\n\nג\n\n**רשאכ םכתא ךרביו םימעפ ףלא םכילע ףסוי םכיתובא יקולא 'ה**\n\n**םכל רבד**\n\n**הרואכל**\n\n. םימעפ ףלא יד ןופ טשפ זיא סאוו ןייטשראפ ןעמ ףראד\n\n**טנידעג טאה רע זא ןטלאהעג טאה וניבר השמ**\n\n**הארימ**\n\n**רעד**\n\nסאד ןענעז םימעפ ףלא יד זא ,לאוי ירבד ןיא ריבסמ זיא ל\"ז יבר\n\nםעד ןעניד ראפ רכש סלא ןעמוקאב טפראדעג טאה השמ סאוו\n\nרע סאוו הדובע עצנאג יד זא ןטלאהעג טאה השמ לייוו , הארימ ןטשרעביוא\n\nטלאצאב רעטשרעביוא רעד זא טייטש הארי ייב ןוא , הארימ ראנ זיא טהוט\n\nםיא ףראד רעטשרעביוא רעד סאוו סאד זא טגאזעג השמ טאה ,רוד 'ףלאל'\n\n. םימעפ ףלא זיא סאד ןוא ,ייז רע טבעג הארימ הדובע ןייז ראפ ןלאצאב\n\n**הבהא ןוא הארי זיא געוו עגיטכיר יד**\n\n**ןעק'מ**\n\nסאוו רענייא זא טייטש'ס סאוו סאד זא ,ןגאז ןוא ןייז ףיסומ רשפא\n\nטשינ זיא ,רוד ' םיפלאל' רכש עטלפאד טאה רע ןוא הבהאמ טוט\n\nראנ רע טמוקאב הארימ ךיוא ןוא הבהאמ ךיוא טניד רע ביוא זא טשפ\n\nטנזיוט ןייא ןוא הארי ראפ טנזיוט ןייא רע טאה ןאד סאוו ,טנזיוט ייווצ\n\nןוא הבהאמ ןטשרעביוא םעד ןעניד לייוו ,ןייז טשינ ןעק סאד , הבהא ראפ\n\nיוו יוזא ,ןהוט ףראד'מ סאוו געוו עגיטכיר עמאס יד ךאד זיא הארימ\n\n.'ומיחרו וליחדב' ןרעוו ןהוטעג ףראד הוצמ א זא טסייוו'מ\n\n**טלפאד גנולאצאב יד זיא הבהאמ ןוא הארימ**\n\n**ןעק**\n\nביוא זיא םיפלאל ןוא ףלאל זא טייטש'ס סאוו סאד זא ןגאז ןעמ\n\nרעבא , הארי טימ רעדא הבהא טימ רעדא ןטשרעביוא םעד רע טניד\n\nןופ טנזיוט יד ןופ ץוח רע טמוקאב , הארימ ןוא הבהאמ סע רע טהוט ביוא\n\n. הבהאמ ןופ לאמ טנעזיוט ייווצ ךיוא הארימ\n\n**ןמאנ דבע א זיא רע לייוו - השמ חמשי**\n\n**ןוא**\n\n,'ול תארק ןמאנ דבע יכ וקלח תנתמב השמ חמשי' טשפ זיא סאד\n\nראפ ןבעגעג טאה רע סאוו הנתמ יד טימ טיירפעג ךיז טאה השמ זא\n\nד\n\nירבד\n\nםעד טניד סאוו ןמאנ דבע ןא ךאד זיא רע לייוו ,טנזיוט יד – ןדיא יד\n\nטנזיוט ייווצ יד טימ ןביילב טעוו רע ןוא , הארימ ןוא הבהאמ ןטשרעביוא\n\n. הבהאמ ןופ\n\n\n\n**רשאכ םכתא ךרביו םימעפ ףלא םכילע ףסוי םכיתובא יקולא 'ה**\n\n**םכל רבד**\n\n**רעד**\n\nרכש יד ןבעגעג קעווא טאה רע זא טשטייט לאוי ירבד ןיא ל\"ז יבר\n\nףלא שטייט זיא סאד ןוא , הארימ ןוטעג טאה רע סאוו תווצמ יד ןופ\n\nםעד ףיוא טגאז שרדמ רעד סאוו ריבסמ רע זיא םעד טימ ןוא . םימעפ\n\nד\" הה , קוספ\n\n(ח ,ה םילהת)\n\nזיא'ס לייוו זא ,ךתאריב ךשדק לכיה לא הוחתשא\n\n.ןבעג ייז וצ םימעפ ףלא רע טאה אליממ ךתאריב\n\n**טנזיוט ראנ טשינ זיא םימעפ ףלא**\n\n**רעד**\n\nןבעגעג טשינ טאה רע זא טגאז סאוו שרדמ א ךאנ טגנערב ל\"ז יבר\n\nןייק ןעייג ייז זא ראנ ,טצעי ןעמוק סאוו תורוד ףלא יד ראפ ראנ\n\nןייז טעוו סאד ןוא תורוד עגידרעטעפש יד ראפ ןייז סע לאז לארשי ץרא\n\n' םעפ ףלא' טשינ טייטש שרדמ רעד טגאז םעד ןגעוו ןוא , םיפלא ףלאל\n\n.ס'רעטנזיוט ךאסא טניימ'ס לייוו ' םימעפ ףלא' ראנ\n\n**שדקמה תיב ןיא רקיע רעד זיא שדקמ ארומ ןופ הוצמ יד**\n\n**ןעק**\n\nלכיה לא הוחתשא' קוספ ןטימ שרדמ רעד טניימ סאוו ,טשפ ןייז\n\nסאוו סאוו שדקמ ארומ ןופ הוצמ יד אד זיא'ס זא ,'ךתאריב ךשדק\n\nןיא סע זיא ץראל ץוח ןיא ןוא ,וארית ישדקמו  שדקמה תיב ןפיוא טייג\n\n, שדקמ ארומ ןופ הצמ רקיע יד רעבא . םישרדמ יתב יד ,טעמ שדקמ עדעי\n\nתיב ןיא ,לארשי ץרא ןיא זיא ךתאריב ךשדק לכיה לא הוחתשא ןופ\n\nקוספ ןיא טייטש'ס יוו , שדקמה\n\n( גכ , די םירבד)\n\nםוקמב ךיקלא ' ה ינפל תלכאו'\n\nדמלת ןעמל 'וגו ךנגד רשעמ , םש ומש ןכשל רחבי רשא\n\nהאריל\n\n' ה תא\n\n. שדקמה תיב ןיא ןעמ טאה הארי רקיע רעד לייוו ,' םימיה לכ ךיקלא\n\nב\n\nירבד\n\nןענרעל טייג'מ ראפ ךאנ ןוקית א ןייז ןיוש לאז'ס זא תבש םעד ןבעגעג\n\n. הרות עגילייה יד\n\n\n\n**לארשי לכ לא השמ רבד רשא םירבדה הלא**\n\n**יד**\n\nטנ' שרד ארמג\n\n(. אי ףד ןירדהנס)\n\nרעד סאוו השמ ןופ סיורא טנרעל'מ זא\n\nטגאזעג ןוא ,ןדיא עלא ןשיווצ ןעוועג ללוכ םיא טאה רעטשרעביוא\n\nהנא דע'\n\nםתנאמ\n\nתצקמבש תצקמ א ראנ וליפא זא 'יתורותו יתווצמ רומשל\n\nרעטשרעביוא רעד טאה , תבש ןיא ןמ יד ןופ טגיילעגסיורא ןבאה ןדיא יד ןופ\n\n.ןעמאזוצ ןעמעלא ראפ טגאזעג\n\n**םיבר א ראפ ראנ רסומ**\n\n**ןעק**\n\nסאד זא ' השמ רבד רשא םירבדה הלא' קוספ ןיא טשפ ןגאז ןעמ\n\nזא 'לארשי לכ לא' ,טנרעלעגסיוא ייז טאה השמ סאוו ךאז יד זיא\n\nטשינ ןוא רוביצ א ראפ טגאז'מ ןעוו ראנ סע זיא רסומ ןגאז ליוו'מ ןעוו\n\nסאוו יד זא שטאכ זא ,ןהוטעג השמ ךיוא טאה סאד ןוא , דיחי ןייק ראפ\n\nטאה ךאד , םידיחי ראנ ןעוועג ןענעז ןכאז עלא יד ףיוא טגאלקעג ןבאה\n\n.רסומ טגאזעג ייז ןאד ראנ ןוא ןדיא עלא ןעוועג ללוכ רע\n\n**ללכ עצנאג יד ןופ תוריבע**\n\n**ןעק**\n\nעלא יד זא טגאזעג טאה רע זא 'לארשי לכ לא השמ רבד' טשפ ןייז\n\nטאה רע ןוא ,לארשי ללכ ץנאג וצ תוכייש א טאה ןדיא יד ןופ םימגפ\n\nךיוא טאה רע ןוא ןדיא עלא ראפ דייר רסומ עגנערטש יד טגאזעג םעד ףיוא\n\nץנאג ןיא ןעגנאהעגנא זיא'ס סאוו םעד טימ ןוא , םעד ןיא ןעוועג ללוכ ךיז\n\n. םעד ףיוא הרפכ א ןבאה ןוא ןהוט הבושת רעגנירג ןעמ ןעק לארשי ללכ\n\n**ןוא**\n\nרבד רשא טשפ זיא סאד\n\nלארשי לכ לא השמ\n\nטאה השמ זא טניימ\n\nרע טאה םעדכאנ ראנ ןוא לארשי ללכ ןיא ןעוועג ללוכ ךיז\n\n.ןוטעג ןבאה ייז סאוו תוריבע עלא טנכערעגסיוא\n\n\n\nהדוהי ינב\n\nא\n\n**םירבד**\n\n**רבדמב ןדריה רבעב לארשי לכ לא השמ רבד רשא םירבדה הלא**\n\n**בהז ידו תוריצחו ןבלו לפות ןיבו ןראפ ןיב ףוס לומ הברעב**\n\n**רעד**\n\nרעטרעוו יד ןיא זא ךלמילא םעונ ןיא טגאז ךלמילא 'ר יבר רעגילייה\n\nארמג יד יוו , תבש תרימש זמורמ זיא ' םירבדה הלא'\n\n(: זצ תבש)\n\nטנרעל\n\nאירטמיג זיא הלא זא ' םירבדה הלא' רעטרעוו יד ןופ תוכאלמ ט\"ל יד סיורא\n\nסאד ןוא ,39 סע זיא ,1 ךאנ זיא םירבד' ה ןוא ,2 ךאנ זיא םירבד ןוא ,36\n\n. תוכאלמ ט\"ל ןופ ןובשח רעד זיא\n\n**תוריבע עלא ףיוא ןוקית א זיא תבש תרימש**\n\n**ןעק**\n\nלחומ ןעמ זיא תבש תרימש ךרוד זא טייטש'ס זא ןייז זמרמ ןעמ\n\nארמג יד יוו , תוריבע עלא\n\n(:חיק תבש)\n\nקוספ ןפיוא טנ' שרד\n\n(ב , ונ היעשי)\n\nלא םעד ףיוא ארמג יד טגאז 'וללחמ תבש רמוש תאז השעי שונא ירשא'\n\nןזייוו טלאוועג ייז וניבר השמ טאה סאד ןוא ,'ול לוחמ' אלא 'וללחמ' ירקת\n\nייז םגפ םייב ךיילג ןיוש רע טאה , תוריבע עלא יד סיוא טנכער רע ןעוו\n\nןוקית רעד זיא סאד תבש תרימש זא , םעד ףיוא ןוקית םעד ךיוא ןזיוועג\n\n. תוריבע עלא ףיוא\n\n**הרות יד ראפ ןבעגעג ןעמ טאה תבש**\n\n**ןוא**\n\nןופ הוצמ יד ןבעגעג טאה'מ סאווראפ ךיוא ןעמ טייטשראפ םעד טימ\n\nרעד לייוו , הרות ןתמ ראפ ךאנ ןעוועג זיא סאוו  הרמ ןיא תבש\n\nןבאה טפראדעג טאה'מ ןוא , הכמל האופר םידקמ ךאד זיא רעטשרעביוא\n\nרעטשרעביוא רעד טאה אליממ , הרותה תלבק ראפ ךאנ הבושת יד טיירג\n\n• 27 •", "**|||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||||**\n\n**|**\n\n**|**\n\n**|**\n\n**|**\n\n**| |**\n\n**| |**\n\n**| |**\n\n**| |**\n\n**| |**\n\n**| | || | | | | | | | | | | | | | | | | | | | |**\n\n**|**\n\n**|**\n\n**|**\n\n**|**\n\n**|**\n\n**ÚÏ „ß ÁÏ˜È ˘ÏÁÔ Ú¯ÂÍ**\n\nÓ‰ ˘‰˘·˙È Â·¯¯˙È ·ÚÊ‰È¢˙ Ï˘Â‡ÏÈ „·¯ ‰ß ÊÂ ‰ÏÎ‰\n\nÂÎ˙·˙ÈÌ ÚÏÈ ‚ÏÈÂÔ ÙÚÓÈÌ ·‡ ·˜ˆ¯‰ ÂÙÚÓÈÌ ·‡¯ÂÎ‰\n\nÎ‡˘¯ ÁÈ ‰ß „Ú‰ Â‰‡È¯ ÚÈÈ ·˙Â¯˙Â Ï¯‚Ï ‰ÓÏ‡Î‰\n\n˜·ˆ˙ÈÌ ÂÒÈ„¯˙ÈÌ ÏÚÈÈ‰Ì Ï˙˙ ÚÏÈÎÌ ‰ÈÂÌ ·¯Î‰\n\n‡‡ ÊÚÈ¯‡ „ÓÔ Á·¯È‡\n\nÓÈÁÏ Ï‡Â˜ÓÈ ‚È¯Ò‡ ·ÒÈÚ˙‡ „˘ÓÈ‡\n\n**ÁÓÔ ÈÁÈ‡Ï ÓÈÎÏ ˘ËÈÈÓÚËı**\n\n„ÂÓ¢ı ˜¢˜ ˙ÂÏ„Â˙ ÈÚ˜· ÈÂÒÛ „ÁÒÈ„È Ò˜ÂÂÈ¯‡ ·¢Ù\n\n**˘˙ ˙˘Ò¢Á ÏÙ¢˜**\n\n·¯Â˜ÏÈÔ ÆÈÆ Èˆ¢Â\n\n˘\n\n‡\n\nÏÂ˙Â˙˘Â\n\n·Â\n\n˙\n\n·\n\n¯ÂÍΩÚ„ÈΩÚ„Ω˘ÌΩ˙‰Ï\n\n˙Â\n\n**רפס**\n\n**שושמ**\n\n**םינובנ**\n\n**ינינע לע**\n\n**תוכרב עבשו ןיאושנו םיאנת**\n\nתודיסחו רסומ הדגא ךרדב ,םינינפמ םירקי ,םימיענ םישורד\n\nתומדקה ,םירפסו םירפוס יפמ ,םישרשומ זפ ינדא לע ,םישרדנ\n\n,םיריהזמ עיקרה רהוזכו ,םיריפסכ םיריאמה ,םירשיו תויתימא\n\nיבב ,םירדוסמ תוכרב עבשו םיאנתה חסונ ,ןיאושנ ינינע לע\n\n.םינועמ ןכוש רזעב ,ם”ינובנו םימכח בל ררועל ,םירמאנ אשרדמ\n\n׳ה יתוא ןנח רשא\n\n**ץטעמנייטש לכימ לאיחי ןמחנ**\n\nפ”ב אריווקס ידיסחד ףסוי בקעי תודלות ק”ק ץמוד\n\nםינובנ תרטע ,םינובנ ראב ,םינובנ יתפש ,םינובנ בישמ ס”חמ\n\nםינובנ תנשמו\n\n**ק”פל ד”פשת תנש - ו”צי .י .נ ןיקורב**\n\nשושמ\n\nםינובנ\n\nא רמאמ\n\nב\n\nהנשמב אתיאדכ רכש שקבליוארה\n\n(ג\"מ\n\nא\"פ\n\nתובא)\n\nםידבעכ ויהת לא'\n\n.'סרפ לבקל תנמ לע ברה תא םישמשמה\n\nימ 'ירשא'ש ןטייפה תנווכב שריפ אלא\n\nותואבש ,םלשה ןוקיתה ימיל הכחמש\n\nאוהש ה\"יהי ארקנ ה\"יוה םש היהי ןמזה\n\nםיימעפ לופכ\n\nוהזו ,ה\"י תויתוא\n\nימולשת'\n\nתוליפכב דיתעל ומכ בתכי םשהש'לפכ\n\n.א\"ה ד\"וי תויתוא\n\n'ה-י בחרמב יננﬠ'\n\nא\"ה ד\"וי םיימﬠפ ובתכיש\n\nקוספב זמורמ הזש דוע רמול רשפאו\n\nםילהתב\n\n(ה חיק)\n\n,\n\nה-י יתארק רצימה ןמ'\n\n,'ה-י בחרמב יננע\n\nךלמה דוד לש וכרדש\n\nךרבמ היהש םשכ הערה לע ךרבל היה\n\nהאריש ללפתמ היה םנמא ,הבוטה לע\n\nרמא ןכ לעו .יוליגב ת\"ישה ידסח תא\n\n,'ה-י בחרמב יננע ה-י יתארק רצימה ןמ'\n\nהיה רצימו הרצ לש בצמב היהשכ ףאש\n\nללפתמ היה לבא ,ת\"ישהל ךרבמו ארוק\n\nדסח תגהנה ול האריו ת\"ישה ולביחריש\n\nבוטה לע ךרבל לכויו 'בחרמב'םימחרו\n\nיננע' ללפתמ היהש המ והזו,הלגנה\n\n.'ה-י בחרמב\n\nע\"יז ץישפארמ ק\"הרה ירבדיפלו\n\nהיהיש םיפצמו םישקבמ ונאש,ל\"נה\n\nתויתואב בתכיו םלש םשה\n\n,ה\"יהי\n\nקתמוי\n\nרואיב תפסותב הז קוספ ונל\n\nרצמה ןמ' ,\n\nה-י יתארק\n\nרצימה ןמזב התעש רמולכ\n\nםעפ קר ה\"י תויתוא שי תולג לש\n\nיתארק כ\"פעאו ,םשה תביתכ ךותבתחא\n\nינא שקבמ םלוא ,ת\"ישהל\n\nבחרמב יננע'\n\n'ה-י\n\n'ב ה\"יוה םשב היהיש\n\nרמולכ\n\n,ה-י תויתוא םימעפ\n\nונל ת\"ישה ביחריש\n\nםלשה ןוקיתה הלגתיו המילשההלואגב\n\nהכזנ ךכבו ,םימחר ולוכ היהישדיתעל\n\nםשה תביתכב ה\"י תויתוא םיימעפהיהיש\n\n.אובל דיתעל םלשה ןוקיתב\n\nונינמ הלﬠיש - 'ה\"פי הלﬠי גוויזהש'\n\n'י\"נדא ה\"יהי' ןובשחל\n\nראבמ הזבו\n\nע\"יז ץישפארמ ק\"הרה\n\n(םש)\n\n,םלועה תכרב תא\n\nגוויזה הלעיש'\n\n,'ה\"פי\n\nאירטמיגב הלוע ה\"פי תבית יכ\n\nה\"יהי' תומש ןובשח\n\nרפסמכ ה\"צ\n\nהכרבה תנווכו .ה\"צ םילועש\n\n'י\"נדא\n\nאוה הלכהו ןתחל\n\nןתח לש גוויזה ידי לעש\n\nדוחי ןוילעה גוויז אימש ימשב םרגי הלכו\n\n,היתניכשו אוה ךירב אשדוק\n\nלש גוויזהו\n\nהלואגה תא ברקמ אוה ירה הלכו ןתח\n\nשה\n\nיכ 'ה\"פי הלעי' םירמוא ןכלו ,המיל\n\nאיה 'הלעי' תבית\n\nןובשחב הילע ןושלמ\n\n,םוכסו\n\nרמולכ\n\nהזה גוויזהש םיכרבמש\n\nםילש אדוחי תאו חישמה תאיב תא איבי\n\nדע ,היתניכשו אוה ךירב אשדוק לש\n\nתאיבב ומכ ה\"צ רפסמב תומשהולעיש\n\n.ונחישמ\n\nראבמ הזבו\n\nע\"יז ץישפארמ ק\"הרה\n\nתא\n\nה\"ע וניבא םהרבאב רמאנש\n\nקוספה\n\n'להואה חתפ בשוי אוהו'\n\n(א ,חי תישארב)\n\n,\n\nוניבא םהרבא לש ותדובעש\n\nראבמו\n\nאוה ךירב אשדוק דוחיי דחיילהתיה\n\nחישמה תומיל איבהלו ברקלו היתניכשו\n\n,םלשה ןוקיתלו\n\nוניבא םהרבא היה ןכלו\n\nשושמ\n\nםינובנ\n\nא רמאמ\n\nג\n\n'ה\"פי' תובית ישאר ,'להוא'ה חת'פ בשו'י'\n\n,\n\nהתיה דימת ותדובעו ותנווכ לכ יכ\n\nאובל דיתעל לש דוחייה תא דחייל\n\nה\"יהי' אירטמיגב אוהש,ה\"פי תניחבב\n\n.'י\"נדא\n\nתנווכש 'תובא ידבﬠ לשןתחיש ה\"פי'\n\nהז דוחי םשל התיה רזﬠילא\n\nלש ודימלתו\n\nץישפארמ ק\"הרה\n\nרפסב\n\nבהזה דיבר\n\n(י\"שרב ה\"ד הרש ייח תשרפ)\n\n,\n\nופרוח ימיבש ,וברמ עמשש המ איבמ\n\nתוחמשב 'ןחדב' רותב שמשל ךלוה היה\n\nרמוא היהשכ ןווכמ היהךכו ,ןיאושינ\n\nותונחדב תעב הלכהו ןתחה תא ךרבמו\n\nגוויזה הלעיש\"\n\n\"הפי\n\nתא ךישמהל ,\n\nהמילשה הלואגה לש ןוילעה דוחיה\n\nאוהש\n\nהלועש\n\n,'י\"נדא\n\nה\"יהי'דוחי\n\n'ה\"פי' רפסמכ ה\"צ אירטמיגב\n\nאבומכו .\n\nלכל ךלהש ושדוק תנווכ התיה וזש\n\nודובכ יפל היה אלש ףא ןיאושינ תחמש\n\nןתח לש גוויזבש ןויכ ,קידצ ותוא לש\n\nתאו המלשה הלואגה תאםיברקמ הלכו\n\n.םלשה דוחיה\n\nרפסב ףיסוה דועו\n\n,בהזה דיבר\n\nןכש\n\n,לארשיב ןושארה ןיכודישרשקב ונאצמ\n\nרזעילא תא וניבא םהרבאחלש רשאכ\n\nבתכו .ונב קחציל השא ךדשל\n\nי\"שר\n\nםש\n\n(במ ,דכ תישארב)\n\n:\n\nהפי אחא יבר רמא\n\nםוקמה ינפל תובא ידבע לש ןתחיש\n\n,םינב לש ןתרותמ\n\nלש השרפ ירהש\n\nיפוג הברהו ,הרותב הלופכ רזעילא\n\nקיידו ,כ\"ע ,הזימרב אלאונתנ אל הרות\n\nי\"שר\n\nבתכו ונושלב\n\nה\"פי'\n\nלש ןתחיש\n\nותמגמ לכש זומרל ידכ'תובא ידבע\n\nשודק גוויז יאהב רזעילאלש ותנווכו\n\nידכו ,היתניכשו ה\"בוק דוחי םשל התיה\n\nהלועש דיתעל לש םלשהדוחיל איבהל\n\nןינמכ אירטמיגב\n\nותחיש לכו ,'ה\"פי'\n\nה\"פי' םשל היה רזעילאלש וישעמו\n\n.תומילשב ןוילעה דוחיה תא גווזל 'ןתחיש\n\nלס ן\"מא'\n\nדוחיה היהיש - 'ה\"\n\n'ה\"לס' אירטמיגב\n\nונב שריפ וירבד יפ לעו\n\nיבר ק\"הרה\n\n,ע\"יז בוקיזדמ רזעילא\n\nםירמואש והזש\n\nהכרבה לע םינועו\n\n,'הלס ןמא'\n\nתבית יכ\n\nן\"מא\n\nדוחי רפסמכ א\"צ אירטמיגב הלוע\n\nתביתו ,י\"נדא ה\"יוה תומש\n\nה\"לס\n\nהלוע\n\nה\"יהי' תומשה דוחי לשןובשחכ ה\"צ\n\n,חישמה תאיבב ומכ 'י\"נדא\n\nרשא הזו\n\n,'ה\"לס ן\"מא ונימיב הרהמב' םישקבמ\n\n,תולגה תע לש דוחיה אוהשן\"מא רפסמש\n\nלאוג אובב דוחיה אוהש 'ה\"לס'ל ךפהתי\n\n.קדצ\n\nרפסבו\n\nבל בטיי\n\n(המלו ה\"ד תוטמ תשרפ)\n\nלש רוא רצוי תליפתב ןכ זומרל בתכ\n\n,שדוק תבש\n\nרצוי ,הלס ךוממורי לכה'\n\n,'לכה\n\nתבית דבלמ ולאה תוביתה יכ\n\nםה 'לכ'ה רצו'י ,ךוממור'י,לכ'ה' ,'הלס'\n\nתובית ישאר\n\n,'ה\"יהי'\n\nתאצמנ םהיניבו\n\nתבית\n\nה\"צ אירטמיגבש 'ה\"לס'\n\nרפסמכ\n\nרמולכ .'י\"נדא ה\"יהי'תומש דוחי\n\nאובל דיתעלש\n\nהמילשה הלואגה תעב\n\nתע התואבו ה\"לס רפסמב היהי דוחיה\n\n.'לכה רצוי הלס ךוממורי לכה' ויהי\n\nשושמ\n\nםינובנ\n\nא רמאמ\n\nא\n\nםיאנתה רטש ןושלב םיזמרו שורד\n\nא רמאמ\n\n'תיראשו בוט םש ןתי אוה תירחא תישארמ דיגמה'\n\nדיתﬠל לש םלשה דוחיה תא ןיברקמ ןיאושינה\n\nהזב זמרה 'תירחא תישארמ דיגמה'\n\nרשאכ אנד תמדקמ לארשי גהנמ\n\nןתח ןיב םיאנת רטש חסונ םיבתוכ\n\nםירמואו וב םיחתופ ,הלכל\n\nדיגמה'\n\nרמ\n\nתיראשו בוט םש ןתי אוה תירחא תישא\n\n.'םיאנתה ירבד ולאל\n\nהמ ינפמ ןיבהל שיו\n\nלש הז ראות אקוד וטקנ\n\nתישארמ דיגמה'\n\n.הז ןושלב זמרה המו 'תירחא\n\nהלﬠי ןכיהל 'הפי הלﬠי גוויזה'\n\nע\"יז ץישפארמ ק\"הרה\n\nורפסב\n\nערז\n\nשדוק\n\n(םג ה\"ד אריו)\n\nןושל לע דמוע ,\n\nתא םיכרבמשכ ישניא ירמאד הכרבה\n\n:ןיאושינ תחמש תעב הלכהו ןתחה\n\n.'הפי גוויזה הלעיש'\n\nןיבהל ךירצ הרואכלו\n\nגוויזה הלוע םוקמ הזיאלהלעי ןושלה\n\n.ה\"פי הלעיש הנווכה והמו ,הלעמל\n\nםשה בתכי ןוקיתה תﬠב אובל דיתﬠל\n\n'ה\"יוה' םוקמב 'ה\"יהי'\n\nראבמו\n\nץישפארמ ק\"הרה\n\n,ושדוקב\n\nאמלע יאהב וניתדובע תילכת הנהש\n\nאוה\n\nאוה ךירב אשדוק דוחי םשל\n\n,היתניכשו\n\nםינווכמו םירמוא ונאש ומכו\n\n'יוה םשה הנהו .הוצמ לכ תיישע ינפל\n\nםשהו ,אוה ךירב אשדוק 'יחבל זמרמ\n\nדוחיו ,'יתניכש 'יחבל זמרמ י\"נדא\n\nדחיל\n\nהנווכה\n\n'יתניכשו\n\nה\"בוק\n\n.י\"נדאו ה\"יוה תומשה ינשרבחלו\n\nהלבק ירפסב ראובמ הנהו\n\nהרות יטוקל)\n\nל\"זיראהל\n\n,די קרפ הירכז\n\nשודקה ה\"לש\n\nתודלות\n\n(חפר תוא 'ה תיב םדא\n\nהלעתי ל\"תעלש ,\n\n,ד\"וי תואל תויהל 'יוה םשד ו\"או תואה\n\nהזו ,\"היהי\" ל\"תעל בתכי 'יוה םשהו\n\nה\"יהי אוהה םויב' קוספה ןושלב זמורמ\n\n,'דחא ומשו דחא 'ה\n\n'ה\"יוה ,היהי\n\nרמולכ\n\nהיהת איה 'היהי' תבית ןמזה ותואבש\n\nאובל דיתעל הז יפלו .ה\"יוה םש םוקמב\n\nותרוצ היהי 'יתניכשו ה\"בוקד דוחיה\n\n.'י\"נדא ה\"יוה' םוקמב 'י\"נדא ה\"יהי דוחי'\n\n'לפכ ימולשתל הכוח'\n\nלופכ םשה היהיש\n\nרואיבב ,םיקידצ םשב ארמאתימ\n\nהכוח לכ ירשאו' טויפה\n\n'לפכ ימולשתל\n\n(ןוילע ל-א ךורב טויפ)\n\nלוכי ךיאה הרואכלו ,\n\nןמ ןיא ירה לפכ ימולשתל תופצל םדא\n\n• 28 •", "**בוט חיר**\n\nז\n\nתישארב\n\n**ג**\n\nבאוכ םדאה בלו ,םדאה בל םירבשמה\n\nיל בוט אלה ,הככ 'ה יל השע המ לע\n\nדורט תויהל יל המו ,ךירצחב דחא םוי\n\n.תוימשגה ינינע לכב\n\n**ךא**\n\n,םירומאה םירבדב םדאה ןנובתישכ\n\nגונעתה רקיע יכ ,ושפנ םחנתת\n\nתעב אוה ,םדאה תדובעמ ת\"ישהל שיש\n\nתומוקמב ךרבתי ומש םסרפמ רשא\n\nרשא תעב ונייהו ,םיכושחהו םיקוחרה\n\nלע ,תוינחורל תוימשגה תא הלעמ\n\n,תוימשגה ינינע לכ תא שדקמש ידי\n\nהריד תושעל ת\"ישה הואתנ ךכלו\n\nתדובעמ ידימת גונעת לבקל ,םינותחתב\n\nםמצע תא םירבשמ רשא ,םינותחתה\n\nןכ םאו ,תוינחורל תוימשגה תולעהל\n\nתא שדקל םדאה הכוזשכ הברדא\n\nהכוז יזא ,תוימשגה יניינעב וישעמ\n\n.הלודג םיקלא תברקל\n\n**טרפבו**\n\nובל\n\nלע\n\nםדאה\n\nהלעיש\n\nםוי לכב םירמוא ונאש המ\n\nלכמ ונב רחב רשא\" ,הרותה תכרבב\n\nונייהו ,\"ותרות תא ונל ןתנו ,םימעה\n\nםייחה םישנאה תובבר יבר לכמש\n\nםעה תויהל ונא וניכז ,םלועה הזב\n\nשדקל ת\"ישה רחב וב רשא ,רחבנה\n\nםאו ,םלועב לודגה ומש תא םסרפלו\n\nיניינעב גהנתהל םדאה הכוזשכ ןכ\n\nיאב לכו ,הרהטבו השודקב תוימשגה\n\nךל ןיא ,ותדלוי ירשא םירמוא םלוע\n\nהכוז הזבו ,הזמ לודג םימש םש שודיק\n\nםסרפל ,האירבה תילכתל עיגהל םדאה\n\n.םלועב ומש ךרבתי ותוקולא\n\n**(ט\"עשת)**\n\n**ערה רצי הז דואמ בוט הנהו**\n\n**השע רשא לכ תא םיקלא אריו**\n\n**דואמ בוט הנהו**\n\n(א\"ל 'א)\n\n**.**\n\n**אתיא**\n\nשרדמב\n\n('ז תוא 'ט 'רפ ר\"ב)\n\nןמחנ יבר\n\nבר םשב ,ןמחנ רב לאומש רב\n\n,\"דאמ בוט הנה\" ,רמא ןמחנ רב לאומש\n\n\" ,בוט רצי הז\n\n**ו**\n\nרצי הז ,\"דאמ בוט הנה\n\n.אהמתא דאמ בוט ערה רצי יכו .ער\n\nםדא הנב אל ערה רצי ילוליאש אלא\n\nאלו ,דילוה אלו ,השא אשנ אלו ,תיב\n\nרמוא המלש ןכו ,ןתנו אשנ\n\n('ד 'ד תלהק)\n\n.כ\"ע ,\"והערמ שיא תאנק איה יכ\"\n\n**ראובמ**\n\nלמע לכד ,שרדמה ירבדב\n\nהזה םלועה השעמ ןורשכו\n\nוהערמ שיא תאנק דצמ אלא וניא\n\nהיה אל הז ילולו ,ותומכ תושעל\n\n,'ודכו ורשוע תא לידגהל למע םדא\n\n,בוט רציב השרוש ןיא האנקה תדימו\n\nארקנ ערה רצי ךכלו ,ערה רציב אלא\n\nשי האנקה ידי לעש ,\"דאמ בוט\"\n\n.םלועל הבוט\n\n**הנהו**\n\nארמגב אתיא\n\n(ב\"ע ט\"ס אמוי)\n\nןמזבש\n\nולטבש רחאל ינשה ק\"מהיב\n\nארצי םג לטבל ושקב ,ז\"עד ארצי\n\nתעו ליאוה ורמא :םש ורמאו .תוירעד\n\n,הריבעד ארציא ימחר יעבנ ,אוה ןוצר\n\nוזח והל רמא ,והיידיב רסמאו ימחר ועב\n\nהואתנ\n\nת\"ישה\n\nתושעל\n\nהריד\n\nםינותחתב\n\nרחב רשא\n\nלכמ ונב\n\nםימעה\n\nאיה יכ\n\nשיא תאנק\n\nוהערמ\n\nתדימ\n\nשי האנקה\n\nהבוט הב\n\nםלועל\n\nימחר ועב\n\nרסמאו\n\nוהיידיב\n\nתישארב\n\nז\n\n**בוט חיר**\n\n**ד**\n\nאמלע אילכ ,אוההל היל ותילטק יאד\n\n\\[היברו הירפ אהת אלש ,םלועה הלכי ,י\"שרבו\\]\n\n,\n\nאתעיב ועבו ,ימוי אתלת והושבח\n\nאמוי תב\n\n,םויב וב הדלונה הציב ,י\"שרבו\\]\n\nןתוא וליפאו ,םיעמה ןמ םומיחה קספש יפל\n\n\\[היעמב ןילשבתמ ןניא רבכ ,תלוגנרתה הרביעש\n\nירמא ,חכתשא אלו ,לארשי ץרא לכב\n\n,אמלע אילכ הילטקנ ,דיבענ יכיה\n\nאגלפא ימחר יעבנ\n\nטלוש אהיש ,י\"שרבו\\]\n\n\\[תרחאל אלו ותשאל קקזיל םדאב\n\nאגלפ ,\n\nהיניעל והנילחכ ,יבהי אל אעיקרב\n\n\\[לוחכ ידי לע ויניע תא ומיס ,י\"שרבו\\]\n\nשיניאל היב ירגימ אלד ינהאו ,והוקבשו\n\n.כ\"ע ,התבירקב\n\n**ראובמ**\n\nרציהש ףאד ארמגה ירבדב\n\nתא קיזמו ער אוה ערה\n\nלבא ,ל\"חר םתוא איטחמש םיארבנה\n\nאל םא יכ ,םלועה םויקל ךרוצ וב שי\n\nםויק היה אל יזא ,הואתה רצי היה\n\nםירשי תורוד םימיקמ ויה אל יכ ,םלועל\n\nרואיבה והזו .ותרותלו 'הל םינמאנ\n\nהנהו\" ארקנ ערה רציהד שרדמה ירבדב\n\nשי ערה רציה חכב יכ ,\"דאמ בוט\n\n.םלועל םויק\n\n**הזבו**\n\nירחאש חבשל םעט ןתיל שי\n\nםיליחתמ\n\nםישודקה\n\nםימיה\n\nונדמועב הנהד ,תישארב תשרפ אורקל\n\nלכ\n\nרשא\n\nםישודקה\n\nםימיה\n\nרחאל\n\nהלודג תולעתהל הכז לארשי שיא\n\nהרותב קוסעל הכזו ,םימיה ולאב\n\nינבו וינב םע תבשלו ,תוכוסה גחב\n\nתוריש תורימזב גחה תודועסב ותיב\n\nוברקב ובל רבשנ ,יח ל'אל תוחבשתו\n\nונא םיכירצש הככ 'ה השע המ לע\n\nלכב קוסע תויהלו ,לוחה ימיל רוזחל\n\nתורחת םהב שי רשא ,תוימשגה ינינע\n\nתוסחל רתוי בוט אלה ,האנשו האנק\n\nקוסעלו ,ולכיהב רקבלו 'ה םעונב\n\n.םיינחור םינינעב\n\n**הזל**\n\nוב רשא ,תישארב תשרפ םיארוק\n\n,תישארב השעמ ינינע לכ ראבתמ\n\nת\"ישה ארב רשא םירבדהמ דחאו\n\n,\"ערה רציה\" אוה תישארב השעמב\n\nיכ ,\"דואמ בוט הנהו\" רמאנ וילעו\n\nידכ ,םלועה םויקל אוה ותאירב תילכת\n\nבותכה רמאמכ ,םלועה תא בשייל\n\nהיעשי)\n\n(ח\"י ה\"מ\n\nתבשל אלא הארב והת אל\"\n\nילבמ םלועה בשייל רשפא יאו ,\"הרצי\n\nאב הזו .ערה רציה לש הואתמה חכ\n\nתא דובעל וחכב רשא םדאה תא דמלל\n\nהזלו ,םיימשגה םינינעה לכב ת\"ישה\n\nהלעיש ,םיימשגה םינינעה לכ וארבנ\n\n.תוינחורל םדאה םתוא\n\n**םדאהשכו**\n\nיזא ,ובלב הז רבד שירשי\n\nת\"ישה תא דובעל לכוי\n\n,בבל בוטבו החמשב ,לוחה תומיב םג\n\nךרבתי ארובהל חור תחנ תושעלו\n\nתאיב דע ,ומש\n\nהרהמב קדצ לאוג\n\n.ןמא ונימיב\n\n**(ו\"עשת)**\n\nחכ ידי לע\n\nהואתמה\n\nםויק שי\n\nםלועל\n\nםעטה\n\nירחאש\n\nםימיה\n\nםישודקה\n\nםיליחתמ\n\nאורקל\n\nתשרפ\n\nתישארב\n\nוהת אל\n\nאלא הארב\n\nתבשל\n\nהרצי\n\nתישארב\n\nז\n\n**בוט חיר**\n\n**ב**\n\nשרדמב אתיאדכ\n\n('ד תוא 'ב 'רפ ר\"ב)\n\n\"והת\"\n\n,ידמ תולג הז \"והבו\" ,לבב תולג הז\n\n,\"םוהת ינפ לע\" ,\"ןוי תולג הז ךשוחו\"\n\n.כ\"ע ,העשרה תכלממ תולג הז\n\n**לבא**\n\nםימשה תודלות הלא\" ביתכ ןלהל\n\nדיתעל ונייה ,\"םארבהב ץראהו\n\nביתכדכ ,השדח האירב היהיש אובל\n\n(ז\"י ה\"ס היעשי)\n\nםימש ארוב יננה יכ\"\n\nםויב\" היהי זא ,\"השדח ץראו םישדח\n\nיזא ,\"םימשו ץרא םיקלא 'ה תושע\n\nת\"ישה חכ ונייה ה\"יוה חכ הלגתי\n\n,םיקלא הנוכמה ,עבטה תא דדשמה\n\nיכ ןיעב ןיע ץרא יבשוי לכ ואריו\n\nבותכה םידקה ךכלו ,םיקלא אוה 'ה\n\n.\"םימשל ץרא\"\n\n**הזבו**\n\nםיבותכה ראבמ\n\n(ד\"י-'א ח\"מק םילהת)\n\nוהוללה םימשה ןמ 'ה תא וללה\"\n\n.'וגו ץראה ןמ 'ה תא וללה .םימורמב\n\nודבל ומש בגשנ יכ 'ה םש תא וללהי\n\nקדקדל שיו .\"םימשו ץרא לע ודוה\n\n,\"םימשה ןמ 'ה תא וללה\"ב חתפד\n\n.\"ץראה ןמ 'ה תא וללה\" ךכ רחאו\n\nומש בגשנ יכ 'ה םש תא וללהי\" םייסו\n\nןרק םריו .םימשו ץרא לע ודוה ודבל\n\n.םימשל ץרא םידקהו .\"ומעל\n\n**יפלו**\n\nבותכהד ,בטיה ראבתי רומאה\n\nעבטה רשא ,הזה ןמזה לע חתפ\n\nודובכ רכינ ןיא יזאו ,םלועב טלוש\n\n,םימשב קר אלא ,ץראהמ ומש ךרבתי\n\nךרבתי ותולדג םלוכ םיעדוי םש רשא\n\n'ה תא וללה\" רמאנ ךכלו ,ומש\n\nתא וללה\" ךכ רחאו ,\"םימשה ןמ\n\n.\"ץראה ןמ 'ה\n\n**לבא**\n\nהגהנה היהת רשא ,אובל דיתעל\n\nיזאו ,עבטה ךרדכ אלש ןפואב\n\nהיהו\" ,םלועב ומש ךרבתי ודובכ הלגתי\n\nלע ודוה\" יזא ,\"ץראה לכ לע ךלמל 'ה\n\nוריכי םלוע יאב לכ יכ ,\"םימשו ץרא\n\nםידקה ךכלו ,ומש ךרבתי ותולדגב\n\nת\"ישה יניעב רקי יכ ,םימשל ץרא\n\nםיריכמ ,םיקוחרה ץרא יבשויש המ\n\nןמזב היהי הזו ,ומש ךרבתי ותולדגב\n\nהלהת ומעל ןרק םריו\" רשא הלואגה\n\nוריכי םלוע יאב לכש ,\"וידיסח לכל\n\n.ק\"הדכע ,ומש ךרבתי ותולדגב\n\n**םרומה**\n\nהכוזש תעבד ,רומאה לכמ\n\nךרבתי ומש שדקל םדאה\n\nרתוי\n\nת\"ישה\n\nלדגתמ\n\nיזא\n\n,םלועב\n\nיכ ,םינוילעב ומש םישדקמש הממ\n\nתולדגב םיריכמ םיקוחרה תומוקמבשכ\n\n,ךלמה תלעמ לע חיכומ הז ,ךלמה\n\n,ותוכלמב םיריכמ םלוע יאב לכ רשא\n\n,אחישמד אתבקע רוד תאזה תעב ןכלו\n\nהלועפ לכ ,ץראה הסכי ךשוח רשא\n\n,ת\"ישה תדובעב םדאה עגייתמש הנטק\n\nהזב יכ ,ת\"ישה יניעב דואמ הרקי איה\n\nומש ךרבתי ותוקולא םדאה םסרפמ\n\n.רתויב םיקוחרה תומוקמב\n\n**הזבו**\n\nונדמועב םדאה בל קזחתי\n\nל\n\nשדוח ,םינתיאה שדוח רחא\n\nםישעמו תווצמב בבוסמ םדאה רשא\n\nתברק ינאו\" שיגרמ תע לכבו ,םיבוט\n\nךירצ תחא תבב הנהו ,\"בוט יל םיקלא\n\nרשא םימי ,ףרוחה תומיל בושל אוה\n\nברע דע רקובמ רשא ,ץפח םהב ןיא\n\n,הלכלכה לעו היחמה לע םדאה דורט\n\nםיימשגה םינינעה לכב בבוסמ ושארו\n\nיננה יכ\n\nארוב\n\nםימש\n\nםישדח\n\nץראו\n\nהשדח\n\nתא וללה\n\nןמ 'ה\n\nםימשה\n\nןרק םריו\n\nומעל\n\nלכל הלהת\n\nוידיסח\n\nלע ודוה\n\nץרא\n\nםימשו\n\nתדובע\n\nרודב םדאה\n\nאתבקע\n\nאחישמד\n\nהבושח\n\nךורע ןיאל\n\nםוי יל בוט\n\nדחא\n\nךירצחב\n\n**בוט חיר**\n\nז\n\nתישארב\n\n**א**\n\n**תישארב תשרפ**\n\n**ץראה לכ לע ךלמל 'ה היהו**\n\n**םימשה תא םיקלא ארב תישארב**\n\n**ץראה תאו**\n\n('א 'א)\n\n**.**\n\n**שיו**\n\nןלהלד קדקדל\n\n('ד 'ב)\n\nהלא\" ביתכ\n\nםארבהב ץראהו םימשה תודלות\n\nב\"צו .\"םימשו ץרא םיקלא 'ה תושע םויב\n\n'ה\" ביתכ םשו \"םיקלא\" ביתכ ןאכ המל\n\nםימש םידקה ןאכד ב\"צ דוע .\"םיקלא\n\n.םימשל ץרא םידקה םשו ,ץראל\n\n**ראבמ**\n\n**ז\"אא**\n\nורפסב\n\n**בוט בר**\n\nןתשרפב\n\n(תישארב ה\"ד)\n\nורמאש המ םדקהב\n\nל\"זח\n\n('א 'א י\"שרב אבוה)\n\nהלע הליחתב\n\nהארו ,ןידה תדמב ותארבל הבשחמב\n\nתדמ םידקהו ,םייקתמ םלועה ןיאש\n\nוראיבו .כ\"ע ,ןידה תדמל הפתשו םימחר\n\n**םישרפמה**\n\nךרדב גהנתמ םלועהש המד\n\nאוה יכ ,ןידה תדימ הנוכי הז ,עבטה\n\nדמע\" ,עבטה יפכ הגהנהה תא ליבגמ\n\nהגהנהה איה ,\"םימחרה תדמ ףתישו\n\nםשמ אבה ,עבטהמ הלעמלש סנ ךרדב\n\nהזו ,תויווה לכ הווהמה ,ה\"ב ה'יוה\n\nבותכה רמאש\n\n(ה\"ל 'ד םירבד)\n\nאוה 'ה\"\n\nדדשמש םיסינה חכש ונייהו ,\"םיקלאה\n\nםשמ אבה ,תויעבטה תוכרעמ ת\"ישה\n\n\"ישהש תודע אוה ,ה\"ב ה\"יוה\n\nהשוע ת\n\nםוש ןיאו ,םיקלא הנוכמה ,עבטה תא\n\n.הלילח תרחא תושר\n\n**הנהו**\n\nביתכד תולגה ןמזב התע\n\nםירבד)\n\n(ח\"י א\"ל\n\nינפ ריתסא רתסה יכנאו\"\n\nךרדב גהונ וגהנמכ הזה םלועהו ,\"'וגו\n\nךרבתי ותולדג רכינ ןיא ןכ םא ,עבטה\n\n,לעממ םימשב ךא ,םלועה הזב ומש\n\n,םיקלאה אוה 'ה יכ לכה םיעדוי םש\n\n,הלואגה תעב אובל דיתעל ןכ ןיאש המ\n\nימיכו ,ונילע ותוכלמ הארתו הלגת רשא\n\nןיעל ת\"ישה ונארי םירצמ ץראמ ונתאצ\n\nותולדג רכינ היהי זא ,תואלפנו םיסנ לכ\n\nרקייתמ ךלמה יכ ,םימשמ רתוי ץראב\n\nץראה הצקב םיקוחרהש המב רתויב\n\nרשאמ ,ותוממורו ובוטו ולדוג םיריכמ\n\n,ותולדג ועדיו וריכי וילא םיבורקהשכ\n\nוהז ךלמה תא םיללהמ םיקוחרהשכ יכ\n\nוינפל ךלוה בוטה ומשש ןמיסו תוא\n\n.תונידמה לכב\n\n**הזבו**\n\nארב תישארב\" םיבותכה ראבמ\n\nיפ לע הגהנהב ונייה ,\"םיקלא\n\nתאו םימשה תא\" ךכלו ,עבטה ךרד\n\nתורוהל ,ץראל םימש םידקה ,\"ץראה\n\nםיריכמ םה ,םימשבש םינוילעה קרש\n\n,ץראה יבשוימ רתוי ,ולדוגו ודובכ\n\nםניעב המדנ רשא ,עבטה יפ לע גהנתמה\n\nאוה הז לכו ,ו\"ח םלועל גיהנמ ןיאש\n\nךשוחו והבו והת התיה ץראהו\"ש ןמזב\n\n,תויולגה ןמזל זמורה ,\"םוהת ינפ לע\n\nאוה 'ה\n\nםיקולאה\n\nיכנאו\n\nרתסה\n\nינפ ריתסא\n\nץראהו\n\nוהת התיה\n\nךשוחו והבו\n\nינפ לע\n\nםוהת\n\n• 29 •", "ותנותח םוי\n\nםהימעטו םיגהנמ תוכלה\n\nהרצק ךרדב\n\n\\*\\*\\*\n\nרפסה ךותמ טוקיל"];
const TOTAL = pages.length;
let current = 0;
let busy = false;

function renderCover(body) {
  body.innerHTML = `
    <div class="logo-text">slavita</div>
    <div class="logo-text" style="font-size:1rem;letter-spacing:.25em;color:#374151;font-weight:400;">PUBLISHING</div>
    <div class="catalog-title">CATALOG</div>
    <div class="contact">
      <strong>929-468-9989</strong><br>
      SALES@SLAVITAPUBLISHING.COM
    </div>
    <div class="dsb">ד"סב</div>
  `;
  body.closest('.page-card').classList.add('cover');
}

function render(idx) {
  const card = document.getElementById('card');
  const body = document.getElementById('body');
  const strip = document.getElementById('strip');
  const badge = document.getElementById('badge');

  strip.textContent = 'עמוד ' + (idx + 1);
  badge.textContent = 'דף ' + (idx + 1) + ' מתוך ' + TOTAL;

  card.classList.remove('cover');

  if (idx === 0) {
    renderCover(body);
  } else {
    body.innerHTML = pages[idx];
  }

  // Update buttons
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === TOTAL - 1;

  // Update dots
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });
}

function go(idx) {
  if (busy || idx < 0 || idx >= TOTAL) return;
  busy = true;
  const card = document.getElementById('card');
  card.classList.add('fade');
  setTimeout(() => {
    current = idx;
    render(idx);
    card.classList.remove('fade');
    busy = false;
  }, 200);
}

// Build dots
const dotsEl = document.getElementById('dots');
for (let i = 0; i < TOTAL; i++) {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.setAttribute('aria-label', 'עמוד ' + (i + 1));
  d.title = 'עמוד ' + (i + 1);
  d.onclick = () => go(i);
  dotsEl.appendChild(d);
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(current + 1);
  if (e.key === 'ArrowRight') go(current - 1);
});

// Initial render
render(0);
</script>
